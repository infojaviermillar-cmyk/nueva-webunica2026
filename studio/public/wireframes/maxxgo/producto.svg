<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" style="background:#f1f5f9;font-family:sans-serif">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#cbd5e1"/>
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#475569">[LOGO] MAXXGO</text>
  <rect x="250" y="25" width="300" height="30" rx="6" fill="#e2e8f0"/>
  <circle cx="650" cy="40" r="15" fill="#e2e8f0"/>
  <circle cx="700" cy="40" r="15" fill="#e2e8f0"/>
  <circle cx="750" cy="40" r="15" fill="#e2e8f0"/>

  <!-- Breadcrumbs -->
  <text x="40" y="120" font-size="12" fill="#64748b">Inicio &gt; Celulares &gt; Smartphones &gt; Smartphone Max 1</text>

  <!-- Product Images (Left) -->
  <rect x="40" y="150" width="350" height="350" rx="16" fill="#e2e8f0"/>
  <text x="150" y="330" font-size="16" fill="#94a3b8">Imagen Principal</text>

  <rect x="40" y="520" width="100" height="100" rx="8" fill="#e2e8f0"/>
  <rect x="165" y="520" width="100" height="100" rx="8" fill="#e2e8f0"/>
  <rect x="290" y="520" width="100" height="100" rx="8" fill="#e2e8f0"/>

  <!-- Product Details (Right) -->
  <text x="420" y="180" font-size="28" font-weight="bold" fill="#334155">Smartphone Max 1 Pro</text>
  
  <text x="420" y="220" font-size="22" font-weight="bold" fill="#1e293b">$349.990</text>
  <text x="420" y="240" font-size="12" fill="#94a3b8">Antes $399.990 (Ahorra $50.000)</text>

  <line x1="420" y1="265" x2="760" y2="265" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Options: Color -->
  <text x="420" y="300" font-size="12" font-weight="bold" fill="#64748b">COLOR DISPONIBLE</text>
  <circle cx="435" cy="325" r="15" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <circle cx="475" cy="325" r="15" fill="#94a3b8"/>
  <circle cx="515" cy="325" r="15" fill="#475569"/>

  <!-- Options: Size -->
  <text x="420" y="375" font-size="12" font-weight="bold" fill="#64748b">ALMACENAMIENTO</text>
  <rect x="420" y="390" width="80" height="35" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="440" y="412" font-size="12" font-weight="bold" fill="#475569">128 GB</text>
  <rect x="510" y="390" width="80" height="35" rx="6" fill="#e2e8f0"/>
  <text x="530" y="412" font-size="12" fill="#64748b">256 GB</text>
  <rect x="600" y="390" width="80" height="35" rx="6" fill="#e2e8f0"/>
  <text x="620" y="412" font-size="12" fill="#64748b">512 GB</text>

  <!-- Quantity -->
  <text x="420" y="460" font-size="12" font-weight="bold" fill="#64748b">CANTIDAD</text>
  <rect x="420" y="475" width="120" height="40" rx="6" fill="#e2e8f0"/>
  <text x="440" y="500" font-size="16" font-weight="bold" fill="#475569">-</text>
  <text x="475" y="500" font-size="14" font-weight="bold" fill="#475569">1</text>
  <text x="510" y="500" font-size="16" font-weight="bold" fill="#475569">+</text>

  <!-- Add to Cart / Buy Now -->
  <rect x="420" y="535" width="340" height="50" rx="8" fill="#475569"/>
  <text x="530" y="565" font-size="14" font-weight="bold" fill="#ffffff">Agregar al carro</text>
  
  <rect x="420" y="600" width="340" height="50" rx="8" fill="#1e293b"/>
  <text x="540" y="630" font-size="14" font-weight="bold" fill="#ffffff">Comprar ahora</text>

  <!-- Description Section -->
  <rect x="40" y="680" width="720" height="150" rx="12" fill="#e2e8f0"/>
  <text x="60" y="720" font-size="16" font-weight="bold" fill="#334155">Descripción del producto</text>
  <text x="60" y="750" font-size="13" fill="#64748b">El nuevo Smartphone Max 1 Pro redefine los estándares de la industria móvil. Equipado con la</text>
  <text x="60" y="770" font-size="13" fill="#64748b">pantalla Super Retina XDR y el chip Bionic de última generación para un rendimiento increíble.</text>

  <!-- Footer -->
  <rect x="0" y="900" width="800" height="100" fill="#334155"/>
  <text x="40" y="955" font-size="14" fill="#cbd5e1">© 2026 Maxxgo. Todos los derechos reservados.</text>
