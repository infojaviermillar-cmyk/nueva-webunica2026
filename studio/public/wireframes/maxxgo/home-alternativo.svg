<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1350" width="100%" height="100%" style="background:#f8fafc;font-family:sans-serif">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#cbd5e1"/>
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#475569">[LOGO] MAXXGO</text>
  <rect x="250" y="25" width="300" height="30" rx="6" fill="#e2e8f0"/>
  <text x="270" y="44" font-size="12" fill="#94a3b8">Buscar productos...</text>
  <circle cx="650" cy="40" r="15" fill="#e2e8f0"/>
  <circle cx="700" cy="40" r="15" fill="#e2e8f0"/>
  <circle cx="750" cy="40" r="15" fill="#e2e8f0"/>

  <!-- Giant Hero Section (Alta Densidad de Marca) -->
  <rect x="0" y="80" width="800" height="500" fill="#e2e8f0"/>
  <text x="80" y="250" font-size="44" font-weight="black" fill="#1e293b" letter-spacing="-1">TECNOLOGÍA QUE<br/>CONECTA TU MUNDO</text>
  <text x="80" y="360" font-size="16" fill="#475569" max-width="400">Diseños minimalistas y rendimiento industrial para usuarios exigentes.</text>
  <rect x="80" y="410" width="180" height="50" rx="25" fill="#1e293b"/>
  <text x="125" y="440" font-size="14" font-weight="bold" fill="#ffffff">Ver Lanzamientos</text>
  
  <!-- Showcase Box -->
  <rect x="480" y="160" width="260" height="340" rx="20" fill="#cbd5e1"/>
  <text x="560" y="340" font-size="14" fill="#94a3b8">Imagen Producto</text>

  <!-- Large Promo banner -->
  <rect x="40" y="620" width="720" height="200" rx="16" fill="#e2e8f0"/>
  <text x="80" y="710" font-size="28" font-weight="bold" fill="#334155">Pacific Color Edition</text>
  <text x="80" y="740" font-size="14" fill="#64748b">Exclusivos acabados premium diseñados para la oficina moderna.</text>
  <rect x="540" y="695" width="160" height="45" rx="8" fill="#334155"/>
  <text x="585" y="722" font-size="13" font-weight="bold" fill="#ffffff">Explorar</text>

  <!-- Clean Carousel Product list -->
  <text x="40" y="880" font-size="22" font-weight="bold" fill="#1e293b">Colección Destacada</text>
  
  <!-- Product 1 -->
  <rect x="40" y="920" width="220" height="300" rx="16" fill="#e2e8f0"/>
  <rect x="60" y="940" width="180" height="160" rx="12" fill="#cbd5e1"/>
  <text x="60" y="1130" font-size="14" font-weight="bold" fill="#334155">Auricular Noise Cancelling</text>
  <text x="60" y="1160" font-size="16" font-weight="bold" fill="#0f172a">$189.990</text>
  
  <!-- Product 2 -->
  <rect x="290" y="920" width="220" height="300" rx="16" fill="#e2e8f0"/>
  <rect x="310" y="940" width="180" height="160" rx="12" fill="#cbd5e1"/>
  <text x="310" y="1130" font-size="14" font-weight="bold" fill="#334155">Cargador MagSafe Duo</text>
  <text x="310" y="1160" font-size="16" font-weight="bold" fill="#0f172a">$49.990</text>

  <!-- Product 3 -->
  <rect x="540" y="920" width="220" height="300" rx="16" fill="#e2e8f0"/>
  <rect x="560" y="940" width="180" height="160" rx="12" fill="#cbd5e1"/>
  <text x="560" y="1130" font-size="14" font-weight="bold" fill="#334155">Teclado Mecánico Alu</text>
  <text x="560" y="1160" font-size="16" font-weight="bold" fill="#0f172a">$119.990</text>

  <!-- Footer -->
  <rect x="0" y="1270" width="800" height="80" fill="#1e293b"/>
  <text x="40" y="1315" font-size="12" fill="#94a3b8">© 2026 Maxxgo. Diseñado para Pacific Color.</text>
</svg>
