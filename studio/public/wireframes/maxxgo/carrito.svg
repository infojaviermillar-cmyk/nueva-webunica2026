<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" style="background:#f1f5f9;font-family:sans-serif">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#cbd5e1"/>
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#475569">[LOGO] MAXXGO</text>
  <rect x="250" y="25" width="300" height="30" rx="6" fill="#e2e8f0"/>
  <circle cx="650" cy="40" r="15" fill="#e2e8f0"/>
  <circle cx="700" cy="40" r="15" fill="#e2e8f0"/>
  <circle cx="750" cy="40" r="15" fill="#e2e8f0"/>

  <!-- Cart Title -->
  <text x="40" y="140" font-size="28" font-weight="bold" fill="#334155">Carro de Compras</text>

  <!-- Left: Cart Items -->
  <rect x="40" y="180" width="460" height="420" rx="16" fill="#e2e8f0"/>
  
  <!-- Item 1 -->
  <rect x="60" y="200" width="80" height="80" rx="8" fill="#cbd5e1"/>
  <text x="160" y="230" font-size="14" font-weight="bold" fill="#334155">Smartphone Max 1 Pro</text>
  <text x="160" y="250" font-size="12" fill="#64748b">Color: Gris • 128 GB</text>
  <text x="320" y="240" font-size="14" font-weight="bold" fill="#334155">$349.990</text>
  <rect x="420" y="220" width="30" height="30" rx="6" fill="#cbd5e1"/>
  <text x="430" y="240" font-size="14" fill="#64748b">x</text>

  <line x1="60" y1="300" x2="480" y2="300" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Item 2 -->
  <rect x="60" y="320" width="80" height="80" rx="8" fill="#cbd5e1"/>
  <text x="160" y="350" font-size="14" font-weight="bold" fill="#334155">Audífonos Pro Noise</text>
  <text x="160" y="370" font-size="12" fill="#64748b">Color: Negro</text>
  <text x="320" y="360" font-size="14" font-weight="bold" fill="#334155">$79.990</text>
  <rect x="420" y="340" width="30" height="30" rx="6" fill="#cbd5e1"/>
  <text x="430" y="360" font-size="14" fill="#64748b">x</text>

  <!-- Right: Order Summary -->
  <rect x="520" y="180" width="240" height="300" rx="16" fill="#e2e8f0"/>
  <text x="540" y="220" font-size="16" font-weight="bold" fill="#334155">Resumen del Pedido</text>
  
  <text x="540" y="260" font-size="13" fill="#64748b">Subtotal</text>
  <text x="720" y="260" font-size="13" font-weight="bold" fill="#334155" text-anchor="end">$429.980</text>

  <text x="540" y="290" font-size="13" fill="#64748b">Despacho</text>
  <text x="720" y="290" font-size="13" font-weight="bold" fill="#10b981" text-anchor="end">Gratis</text>

  <line x1="540" y1="320" x2="740" y2="320" stroke="#cbd5e1" stroke-width="2"/>

  <text x="540" y="350" font-size="16" font-weight="bold" fill="#334155">Total</text>
  <text x="720" y="350" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="end">$429.980</text>

  <rect x="540" y="390" width="200" height="45" rx="8" fill="#1e293b"/>
  <text x="590" y="417" font-size="13" font-weight="bold" fill="#ffffff">Ir al Checkout</text>

  <!-- Footer -->
  <rect x="0" y="900" width="800" height="100" fill="#334155"/>
  <text x="40" y="955" font-size="14" fill="#cbd5e1">© 2026 Maxxgo. Todos los derechos reservados.</text>
</svg>
